services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - ./fixture-app:/app
      - app_node_modules:/app/node_modules
      - ./dist:/opt/vue-preview:ro
      - ./out:/out
    command: sleep infinity
  bun:
    image: oven/bun:1
    working_dir: /tool
    volumes:
      - ./tool:/tool
      - ./dist:/dist
      - ./out:/out
    profiles: [build]
volumes:
  app_node_modules:
