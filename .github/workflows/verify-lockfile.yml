name: Verify Lockfile

# .github/workflows/actions.lock がワークフローの uses: と食い違っていないか、
# 固定したコミットが上流で検証できるかを確かめる。壊れた lockfile を main に
# 入れないための検査。
#
# lockfile の更新は gh actions-lock で行う（uses: を変えたら再実行する）。
# Dependabot は actions の更新 PR で該当エントリを再生成する。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # 拡張は public preview（pre-1.0）なので、版を固定する。この版は
      # Dependabot も actions.lock も追わない。lockfile の形式が上がって
      # --verify が落ちたら、手元の gh actions-lock と同じ版にここを上げる。
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
