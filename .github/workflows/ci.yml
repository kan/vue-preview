name: CI

# workflow_call: release.yml runs these jobs on the tag before it publishes, and
# takes the binaries from the vue-preview-binaries artifact of the e2e job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/test-unit.sh

  e2e:
    name: Build + E2E (fixture-app in node:22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # --version prints the ref name: the tag when release.yml calls this.
      - name: Build binaries (bun container)
        run: VERSION="$GITHUB_REF_NAME" scripts/build.sh
      - name: Start app container and install fixture-app deps
        run: |
          docker compose up -d app
          docker compose exec -T app npm ci
      - name: Render fixtures and assert
        run: scripts/e2e.sh
      - name: Binary smoke test
        run: docker compose exec -T app /opt/vue-preview/vue-preview-linux-x64 --version
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: preview-output
          path: out/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vue-preview-binaries
          path: dist/vue-preview-*

  windows:
    name: Windows (fixture-app via the dependency cache)
    needs: [e2e]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: vue-preview-binaries
          path: dist
      - name: Render UserTable without node_modules
        working-directory: fixture-app
        run: |
          ../dist/vue-preview-windows-x64.exe --version
          ../dist/vue-preview-windows-x64.exe render src/components/UserTable.vue --json --out ../out/win-UserTable.json
          node -e "
            const r = require('../out/win-UserTable.json');
            const ok = r.modules.kind === 'cache' && r.warnings.length === 0 && r.html.includes('全 4 件')
              && r.deps.includes('src/components/UserTable.vue');
            console.log(JSON.stringify({ modules: r.modules, warnings: r.warnings, deps: r.deps }));
            process.exit(ok ? 0 : 1);
          "
