name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-unit.sh

  e2e:
    name: Build + E2E (fixture-app in node:22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build binary (bun container)
        run: VERSION="${GITHUB_REF_NAME}" scripts/build.sh
      - name: Start app container and install fixture-app deps
        run: |
          docker compose up -d app
          docker compose exec -T app npm ci
      - name: Render fixtures and assert
        run: scripts/e2e.sh
      - name: Binary smoke test
        run: docker compose exec -T app /opt/vue-preview/vue-preview --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-output
          path: out/
      - uses: actions/upload-artifact@v4
        with:
          name: vue-preview-linux-x64
          path: dist/vue-preview

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vue-preview-linux-x64
          path: dist
      - name: Package
        run: |
          mkdir -p release
          cp dist/vue-preview release/vue-preview-linux-x64
          chmod +x release/vue-preview-linux-x64
          (cd release && sha256sum vue-preview-linux-x64 > vue-preview-linux-x64.sha256)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
