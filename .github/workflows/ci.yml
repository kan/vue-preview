name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this tag (e.g. v0.1.0) on the dispatched commit and publish a release. Leave empty to only test.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-unit.sh

  e2e:
    name: Build + E2E (fixture-app in node:22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build binaries (bun container)
        run: VERSION="${RELEASE_TAG:-$GITHUB_REF_NAME}" scripts/build.sh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Start app container and install fixture-app deps
        run: |
          docker compose up -d app
          docker compose exec -T app npm ci
      - name: Render fixtures and assert
        run: scripts/e2e.sh
      - name: Binary smoke test
        run: docker compose exec -T app /opt/vue-preview/vue-preview-linux-x64 --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-output
          path: out/
      - uses: actions/upload-artifact@v4
        with:
          name: vue-preview-binaries
          path: dist/vue-preview-*

  windows:
    name: Windows (fixture-app via the dependency cache)
    needs: [e2e]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vue-preview-binaries
          path: dist
      - name: Render UserTable without node_modules
        working-directory: fixture-app
        run: |
          ../dist/vue-preview-windows-x64.exe --version
          ../dist/vue-preview-windows-x64.exe render src/components/UserTable.vue --json --out ../out/win-UserTable.json
          node -e "
            const r = require('../out/win-UserTable.json');
            const ok = r.modules.kind === 'cache' && r.warnings.length === 0 && r.html.includes('全 4 件')
              && r.deps.includes('src/components/UserTable.vue');
            console.log(JSON.stringify({ modules: r.modules, warnings: r.warnings, deps: r.deps }));
            process.exit(ok ? 0 : 1);
          "

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [unit, e2e, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vue-preview-binaries
          path: dist
      - name: Package
        run: |
          mkdir -p release
          cp dist/vue-preview-* release/
          chmod +x release/*
          (cd release && for f in vue-preview-*; do sha256sum "$f" > "$f.sha256"; done)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # tag push: the pushed tag / workflow_dispatch: the tag is created on this commit
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes $prerelease
